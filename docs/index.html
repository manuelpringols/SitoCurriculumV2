<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Manuel Cerqua — Operaio Specializzato CNC | Sviluppatore Software Junior">
  <meta name="theme-color" content="#000010">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Manuel Cerqua — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/panel.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    #planet-label {
      position: absolute;
      background: rgba(0, 245, 255, 0.08);
      border: 1px solid rgba(0, 245, 255, 0.30);
      border-radius: 4px;
      padding: 7px 18px 9px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      line-height: 1;
    }
    #planet-label.hidden { opacity: 0; pointer-events: none; }
    #planet-name {
      display: block;
      font-family: var(--font-title);
      font-size: clamp(0.6rem, 1.4vw, 0.72rem);
      font-weight: 700;
      color: #4a9ec8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    #planet-category {
      display: block;
      font-family: var(--font-title);
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- ═══ HUD ═══ -->
  <div id="hud">

    <div id="title-block">
      <h1 id="main-title">MANUEL CERQUA</h1>
      <p id="main-subtitle">Operaio Specializzato CNC &nbsp;·&nbsp; Sviluppatore Software Junior</p>
    </div>

    <!-- Label pianeta — posizionato via JS sopra il pianeta -->
    <div id="planet-label" class="hidden">
      <span id="planet-name"></span>
      <span id="planet-category"></span>
    </div>

    <!-- Visibile solo dopo zoom su un pianeta -->
    <div id="back-hint" class="hidden">
      <span>← &nbsp;ESC per tornare</span>
    </div>

    <div id="hint-block">
      <span class="hint-desktop">🖱 Trascina per ruotare &nbsp;·&nbsp; Scroll per zoom &nbsp;·&nbsp; Clicca un pianeta per esplorare</span>
      <span class="hint-mobile">Trascina per ruotare &nbsp;·&nbsp; Pinch per zoom &nbsp;·&nbsp; Tocca un pianeta</span>
    </div>

  </div>

  <!-- ═══ CONTENT PANEL ═══ -->
  <div id="content-panel" class="hidden">
    <div id="panel-scanline"></div>
    <div class="p-corner tl"></div>
    <div class="p-corner tr"></div>
    <div class="p-corner bl"></div>
    <div class="p-corner br"></div>

    <div id="panel-header">
      <div style="flex:1; min-width:0;">
        <div id="panel-planet-name"></div>
        <div id="panel-section-title"></div>
      </div>
      <button id="panel-close" aria-label="Chiudi pannello">✕</button>
    </div>

    <div id="panel-body"></div>
  </div>

  <!-- ═══ DETAIL PANEL (sinistra) ═══ -->
  <div id="detail-panel" class="hidden">
    <div id="detail-scanline"></div>
    <div class="p-corner tl"></div>
    <div class="p-corner tr"></div>
    <div class="p-corner bl"></div>
    <div class="p-corner br"></div>
    <div id="detail-header">
      <button id="detail-back">‹ &nbsp;Indietro</button>
      <div id="detail-title"></div>
    </div>
    <div id="detail-body"></div>
  </div>

  <!-- ═══ LOADING ═══ -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-ring">
        <div class="ring-inner"></div>
      </div>
      <p class="loading-text">Inizializzazione universo<span class="dots">...</span></p>
    </div>
  </div>

  <!-- Glitchium — glitch effects sulle tab -->
  <script src="js/glitchium.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
