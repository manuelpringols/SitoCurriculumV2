<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Manuel Cerqua — Operaio Specializzato CNC | Sviluppatore Software Junior">
  <meta name="theme-color" content="#00021a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Manuel Cerqua — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/panel.css">

  <style>
    /* ── Cursore custom: nasconde il cursore di sistema su tutto ── */
    *, *::before, *::after { cursor: none !important; }

    #cursor {
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
    }

    /* ── Dot default ── */
    #cursor-dot {
      position: absolute;
      width: 8px; height: 8px;
      background: #00f5ff; border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(0,245,255,0.85), 0 0 22px rgba(0,245,255,0.3);
      transition: opacity 0.2s, transform 0.15s, background 0.2s, box-shadow 0.2s;
    }

    /* ── Anello pianeta ── */
    #cursor-ring {
      position: absolute;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--planet-color, transparent);
      transform: translate(-50%, -50%) rotate(0deg);
      box-shadow: 0 0 10px var(--planet-color, transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    @keyframes ring-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    /* ── Fiamme sole ── */
    .flame {
      position: absolute;
      font-size: var(--s, 1.5rem);
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }
    .flame::before { content: '🔥'; }

    @keyframes flame-rise {
      0%   { opacity: 0;    transform: translate(var(--dx), 4px)   scale(0.5) rotate(-8deg); }
      15%  { opacity: 0.95; transform: translate(var(--dx), -5px)  scale(1.0) rotate( 4deg); }
      50%  { opacity: 0.85; transform: translate(var(--dx), -24px) scale(0.9) rotate(-5deg); }
      80%  { opacity: 0.4;  transform: translate(var(--dx), -42px) scale(0.6) rotate( 6deg); }
      100% { opacity: 0;    transform: translate(var(--dx), -56px) scale(0.3) rotate(-4deg); }
    }

    /* ── Stato ON-PLANET ── */
    #cursor.on-planet #cursor-dot  { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
    #cursor.on-planet #cursor-ring {
      opacity: 1;
      animation: ring-spin 1.4s linear infinite;
    }

    /* ── Stato ON-SUN ──
       Il dot NON sparisce: diventa arancione/fuoco per garantire
       sempre visibilità anche se le emoji non rendono col bloom. */
    #cursor.on-sun #cursor-dot {
      opacity: 1;
      background: rgba(255, 130, 0, 0.95);
      box-shadow: 0 0 10px rgba(255, 100, 0, 0.9),
                  0 0 28px rgba(255,  60, 0, 0.55),
                  0 0 50px rgba(255,  40, 0, 0.20);
      transform: translate(-50%, -50%) scale(1.4);
    }
    #cursor.on-sun #cursor-ring { opacity: 0; }
    #cursor.on-sun .flame {
      animation: flame-rise 0.52s ease-out infinite var(--d, 0s);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    #planet-label {
      position: absolute;
      background: rgba(0, 245, 255, 0.08);
      border: 1px solid rgba(0, 245, 255, 0.30);
      border-radius: 4px;
      padding: 7px 18px 9px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      line-height: 1;
    }
    #planet-label.hidden { opacity: 0; pointer-events: none; }
    #planet-name {
      display: block;
      font-family: var(--font-title);
      font-size: clamp(0.6rem, 1.4vw, 0.72rem);
      font-weight: 700;
      color: #4a9ec8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    #planet-category {
      display: block;
      font-family: var(--font-title);
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- ═══ CURSORE CUSTOM ═══ -->
  <div id="cursor">
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>
    <div class="flame" style="--dx:-9px; --s:1.4rem; --d:0.00s"></div>
    <div class="flame" style="--dx:-3px; --s:1.7rem; --d:0.11s"></div>
    <div class="flame" style="--dx: 2px; --s:1.5rem; --d:0.22s"></div>
    <div class="flame" style="--dx: 8px; --s:1.3rem; --d:0.07s"></div>
    <div class="flame" style="--dx:-1px; --s:1.9rem; --d:0.17s"></div>
  </div>

  <!-- ═══ HUD ═══ -->
  <div id="hud">

    <div id="title-block">
      <h1 id="main-title">MANUEL CERQUA</h1>
      <p id="main-subtitle">&nbsp; Sviluppatore Software Junior</p>
    </div>

    <div id="planet-label" class="hidden">
      <span id="planet-name"></span>
      <span id="planet-category"></span>
    </div>

    <div id="back-hint" class="hidden">
      <span>← &nbsp;ESC per tornare</span>
    </div>

    <div id="hint-block">
      <span class="hint-desktop">🖱 Trascina per ruotare &nbsp;·&nbsp; Scroll per zoom &nbsp;·&nbsp; Clicca un pianeta per esplorare</span>
      <span class="hint-mobile">Trascina per ruotare &nbsp;·&nbsp; Pinch per zoom &nbsp;·&nbsp; Tocca un pianeta</span>
    </div>

  </div>

  <!-- ═══ CONTENT PANEL ═══ -->
  <div id="content-panel" class="hidden">
    <div id="panel-scanline"></div>
    <div class="p-corner tl"></div>
    <div class="p-corner tr"></div>
    <div class="p-corner bl"></div>
    <div class="p-corner br"></div>
    <div id="panel-header">
      <div style="flex:1; min-width:0;">
        <div id="panel-planet-name"></div>
        <div id="panel-section-title"></div>
      </div>
      <button id="panel-close" aria-label="Chiudi pannello">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <!-- ═══ DETAIL PANEL (sinistra) ═══ -->
  <div id="detail-panel" class="hidden">
    <div id="detail-scanline"></div>
    <div class="p-corner tl"></div>
    <div class="p-corner tr"></div>
    <div class="p-corner bl"></div>
    <div class="p-corner br"></div>
    <div id="detail-header">
      <button id="detail-back">‹ &nbsp;Indietro</button>
      <div id="detail-title"></div>
    </div>
    <div id="detail-body"></div>
  </div>

  <!-- ═══ LOADING ═══ -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-ring">
        <div class="ring-inner"></div>
      </div>
      <p class="loading-text">Inizializzazione universo<span class="dots">...</span></p>
    </div>
  </div>

  <script src="js/glitchium.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
